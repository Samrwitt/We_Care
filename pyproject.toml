[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "we-care-mt"
version = "1.0.0"
description = "English-to-Amharic medical PDF translation pipeline for Ethiopian reproductive health guidelines"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "We Care MT" }]
keywords = ["amharic", "machine-translation", "medical", "nllb", "pdf"]
dependencies = [
  "pymupdf>=1.24.0",
  "torch>=2.1.0",
  "transformers>=4.40.0",
  "sentencepiece>=0.2.0",
  "protobuf>=3.20.0",
  "sacrebleu>=2.4.0",
  "python-docx>=1.1.0",
  "reportlab>=4.0.0",
  "pyyaml>=6.0",
  "typer>=0.12.0",
  "tqdm>=4.66.0",
  "regex>=2024.0.0",
  "pandas>=2.0.0",
  "Pillow>=10.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-cov>=5.0.0"]
accel = ["accelerate>=0.30.0"]

[project.scripts]
we-care-mt = "we_care_mt.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
we_care_mt = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"
markers = [
  "slow: tests that download or load neural models",
  "gpu: tests that require CUDA",
]

[tool.ruff]
line-length = 110
target-version = "py310"
