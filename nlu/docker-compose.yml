services:
  nlu:
    build: .
    environment:
      WE_CARE_NLU_MODEL: labse
      WE_CARE_TRANSLATION: mt
      WE_CARE_MT_URL: http://we-care-mt:8090
      HF_HOME: /app/.hf_cache
      HF_HUB_DISABLE_XET: "1"
    volumes:
      - nlu_hf:/app/.hf_cache
    ports:
      - "8088:8088"
    depends_on:
      we-care-mt:
        condition: service_started

volumes:
  nlu_hf:
