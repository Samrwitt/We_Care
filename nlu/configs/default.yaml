service:
  name: we-care-nlu
  component: 2
  generative_decoding: false

embeddings:
  # Serve uses default_model: multilingual MiniLM (BERT-family sentence encoder) on CPU.
  # Hash is tests-only. Amharic RoBERTa embedders are optional upgrades when cached.
  default_model: st_multilingual_minilm
  test_model: hash
  models:
    hash:
      kind: hash
      hf_id: null
      dim: 256
      amharic_sentence_encoder: false
      notes: Deterministic test backend. Not semantic.
    st_multilingual_minilm:
      kind: sentence_transformer
      hf_id: sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2
      dim: 384
      max_length: 128
      pooling: mean
      normalize: true
      amharic_sentence_encoder: true
      batch_size: 64
      notes: >-
        Multilingual MiniLM (12-layer BERT student). Designed for CPU paraphrase/retrieval.
        Primary dense encoder; pair with BM25 via RRF. Loads from local HF cache offline.
    amharic_base:
      kind: sentence_transformer
      hf_id: rasyosef/roberta-amharic-text-embedding-base
      dim: 768
      max_length: 510
      pooling: mean
      normalize: true
      amharic_sentence_encoder: true
      domain: general Amharic passage retrieval (ACL 2025 Findings), not clinical
    amharic_medium:
      kind: sentence_transformer
      hf_id: rasyosef/roberta-amharic-text-embedding-medium
      dim: 512
      max_length: 510
      pooling: mean
      normalize: true
      amharic_sentence_encoder: true
      domain: lighter Amharic retriever from the same paper
    labse:
      kind: sentence_transformer
      hf_id: sentence-transformers/LaBSE
      dim: 768
      max_length: 256
      pooling: cls
      normalize: true
      amharic_sentence_encoder: true
      languages_include_amharic: true
      notes: Strong for translation-pair / cross-lingual retrieval; weaker for non-translation paraphrase.
    afro_xlmr:
      kind: encoder_mean_pool
      hf_id: Davlan/afro-xlmr-base
      dim: 768
      max_length: 256
      pooling: mean
      normalize: true
      amharic_sentence_encoder: false
      notes: MLM encoder. Mean-pooled features are a baseline, not STS-trained embeddings.
    st_multilingual_mpnet:
      kind: sentence_transformer
      hf_id: sentence-transformers/paraphrase-multilingual-mpnet-base-v2
      dim: 768
      max_length: 128
      pooling: mean
      normalize: true
      amharic_sentence_encoder: true
      notes: XLM-R family sentence-transformer. Evaluate on Amharic medical pairs before preferring it.

retrieval:
  # Sparse-leaning: multilingual MiniLM helps, but Amharic medical BM25 is still the safer anchor.
  dense_weight: 0.40
  sparse_weight: 0.60
  candidate_k: 80
  top_k: 12
  min_fused_score: 0.10
  abstain_below: 0.18
  fusion: rrf                 # rrf | weighted
  rrf_k: 60
  dual_query_encode: true     # score max(original, expanded) dense similarities
  embed_cache: true
  reranker: medical_features     # medical_features | cross_encoder | none
  cross_encoder_id: cross-encoder/mmarco-mMiniLMv2-L12-H384-v1
  cross_encoder_amharic_validated: false
  polarity_penalty: 0.55
  unreviewed_penalty: 0.08

intent:
  backend: lexicon_prototype     # lexicon_prototype | encoder_trained
  min_confidence: 0.35
  multi_label_threshold: 0.5

ner:
  backend: gazetteer_regex
  min_confidence: 0.5

translation:
  # mt: compose short grounded answers via we-care-mt (Google on :8090). map = phrase list only.
  backend: mt
  mt_url: http://127.0.0.1:8090

safety:
  emergency_always_rule_based: true
  require_source_for_claims: true
  unreviewed_is_not_verified: true
