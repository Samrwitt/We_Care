<!DOCTYPE html>
<html lang="am">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ዌ ኬር</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Ethiopic:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --primary: #8f3f97;
      --light: #eee2ef;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; height: 100dvh; margin: 0; overflow: hidden; }
    body {
      font-family: "Noto Sans Ethiopic", sans-serif;
      color: var(--primary);
      background: var(--light);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 28px 20px;
    }
    ::selection { background: var(--primary); color: #fff; }
    .shell {
      width: min(400px, 100%);
      height: 100%;
      max-height: 860px;
      background: #fff;
      border: 1px solid var(--primary);
      border-radius: 32px;
      overflow: hidden;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
    }
    @media (max-width: 440px) {
      body { padding: 12px; }
      .shell { border-radius: 24px; }
    }
    header {
      padding: 16px 20px 12px;
      border-bottom: 1px solid var(--primary);
      background: var(--primary);
    }
    .wordmark {
      font-size: 26px;
      font-weight: 700;
      color: #fff;
      line-height: 1;
    }
    .tag { margin-top: 4px; font-size: 13px; color: #fff; }
    #log {
      padding: 18px 20px 20px;
      overflow-y: auto;
      min-height: 0;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .welcome, .card {
      background: var(--light);
      border: 1px solid var(--primary);
      padding: 16px 18px;
      border-radius: 4px 18px 18px 18px;
    }
    .welcome h2 {
      margin: 0 0 8px;
      font-size: 20px;
      font-weight: 600;
      color: var(--primary);
    }
    .welcome p { margin: 0 0 14px; color: var(--primary); font-size: 15px; line-height: 1.55; }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; }
    .chip, .send {
      font-family: inherit;
      cursor: pointer;
      border: 1px solid var(--primary);
      background: #fff;
      color: var(--primary);
      border-radius: 999px;
      padding: 8px 12px;
      font-size: 13px;
    }
    .chip:hover { background: var(--primary); color: #fff; }
    .user {
      align-self: flex-end;
      max-width: 92%;
      background: var(--primary);
      color: #fff;
      padding: 10px 14px;
      border-radius: 16px 16px 4px 16px;
      font-size: 16px;
      line-height: 1.55;
    }
    .card { padding: 14px 16px; }
    .am { margin: 0 0 10px; font-size: 17px; line-height: 1.7; white-space: pre-wrap; }
    .am a { color: var(--primary); }
    .am:last-child { margin-bottom: 0; }
    .emerg, .clarify, .empty, .wait {
      margin: 0;
      font-size: 16px;
      line-height: 1.6;
    }
    .emerg, .empty, .wait, .src, .cite, .clarify, .am { color: var(--primary); }
    .src, .cite { margin: 8px 0 0; font-size: 13px; line-height: 1.5; }
    .composer {
      padding: 10px 16px 14px;
      background: #fff;
      border-top: 1px solid var(--primary);
    }
    .box {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
      align-items: end;
      background: #fff;
      border: 1px solid var(--primary);
      border-radius: 18px;
      padding: 8px 8px 8px 14px;
    }
    textarea {
      width: 100%;
      border: 0;
      resize: none;
      outline: none;
      font: inherit;
      font-size: 16px;
      line-height: 1.5;
      min-height: 44px;
      max-height: 140px;
      background: transparent;
      color: var(--primary);
    }
    textarea::placeholder { color: var(--primary); }
    .send {
      background: var(--primary);
      color: #fff;
      border: 0;
      min-width: 72px;
      height: 40px;
      font-weight: 600;
    }
    .send:disabled { cursor: wait; }
    :focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
    .fine { margin: 8px 6px 0; font-size: 12px; color: var(--primary); }
  </style>
</head>
<body>
  <div class="shell">
    <header>
      <div class="wordmark">ዌ ኬር</div>
      <div class="tag" id="statusTag">የሥርዓተ-ተዋልዶ ጤና መረጃ · Reproductive health information</div>
    </header>
    <div id="log"></div>
    <div class="composer">
      <div class="box">
        <textarea id="q" rows="1" placeholder="ጥያቄዎን ይጻፉ… / Ask in English"></textarea>
        <button class="send" id="go" type="button">ላክ</button>
      </div>
      <p class="fine">ይህ መልስ የሐኪም ምክር አይተካም። This is information, not a clinical exam.</p>
    </div>
  </div>
  <script>
    const STARTERS = [
      "የእርግዝና መከላከያ ዘዴዎች ምንድን ናቸው?",
      "ኮንዶም ምንድን ነው?",
      "ክኒን ከተረሳ ምን ላድርግ?",
      "ኢምፕላንት ለምን ያህል ጊዜ ይቆያል?",
      "ጡት እያጠባሁ መርፌ መጠቀም ይቻላል?",
      "What are the contraceptive methods?",
      "How long does an implant last?",
    ];
    const CLARIFY = {
      which_method: "የትኛውን የእርግዝና መከላከያ ዘዴ ማለትዎ ነው?",
    };
    const TALK = {
      greeting: "ሰላም፣ እንኳን ደህና መጡ። ስለ እርግዝና መከላከያ መጠየቅ ይችላሉ።",
      conversation_end: "ደህና ሁኑ። ሌላ ጥያቄ ካለዎት እዚህ ይመለሱ።",
      out_of_domain: "አሁን የምሰጠው መረጃ ስለ የቤተሰብ ምጣኔ ነው። እባክዎ ስለ እርግዝና መከላከያ ይጠይቁ።",
    };
    const log = document.getElementById("log");
    const q = document.getElementById("q");
    const go = document.getElementById("go");
    const statusTag = document.getElementById("statusTag");
    const conversationId = crypto.randomUUID();
    let context = null;
    let engineReady = false;

    function el(html) {
      const d = document.createElement("div");
      d.innerHTML = html;
      return d.firstElementChild;
    }
    function esc(s) {
      return String(s ?? "").replace(/[&<>"']/g, (c) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[c]));
    }
    function add(html) {
      const node = el(html);
      log.appendChild(node);
      log.scrollTop = log.scrollHeight;
      return node;
    }

    const welcome = add(`
      <div class="welcome">
        <h2>እንኳን ደህና መጡ</h2>
        <p>ስለ እርግዝና መከላከያ በአማርኛ ወይም በእንግሊዝኛ መጠየቅ ይችላሉ። You can ask in Amharic or English. ከታች ካሉት ጥያቄዎች አንዱን ይንኩ ወይም የራስዎን ይጻፉ።</p>
        <div class="chips" id="starters"></div>
      </div>
    `);
    STARTERS.forEach((t) => {
      const b = document.createElement("button");
      b.className = "chip";
      b.type = "button";
      b.textContent = t;
      b.onclick = () => { q.value = t; send(); };
      document.getElementById("starters").appendChild(b);
    });

    function linkify(s) {
      return esc(s).replace(/https?:\/\/[^\s]+/g, (url) => `<a href="${url}" target="_blank" rel="noopener">${url}</a>`);
    }
    function askedInEnglish(text) {
      const eth = (String(text).match(/[\u1200-\u137F]/g) || []).length;
      const lat = (String(text).match(/[A-Za-z]/g) || []).length;
      return lat > eth;
    }
    function renderTurn(data, userText) {
      const am = data.amharic_reply || "";
      const en = data.english_reply || "";
      const englishAsk = askedInEnglish(userText || "");
      const reply = englishAsk ? (en || am) : (am || en);
      let html = `<p class="am">${linkify(reply)}</p>`;
      const title = (data.document_title || "").trim();
      const looksLikeDate = /^(መስከረም|ጥቅምት|ኅዳር|ህዳር|ታህሳስ|ጥር|የካቲት|መጋቢት|ሚያዝያ|ግንቦት|ሰኔ|ሐምሌ|ነሐሴ|ጳጉሜ).*\d{4}$/i.test(title)
        || /(መስከረም|ጥቅምት|ኅዳር|ህዳር|ታህሳስ|ጥር|የካቲት|መጋቢት|ሚያዝያ|ግንቦት|ሰኔ|ሐምሌ|ነሐሴ|ጳጉሜ)[^\n]{0,12}\d{4}\s*$/i.test(title)
        || /^\d{4}$/.test(title)
        || title.length < 28 && /\d{4}/.test(title) && /(መስከረም|ጥቅምት|ኅዳር|ህዳር|ታህሳስ|ጥር|የካቲት|መጋቢት|ሚያዝያ|ግንቦት|ሰኔ|ሐምሌ|ነሐሴ|ጳጉሜ)/i.test(title);
      if (title && !looksLikeDate) {
        const page = data.page ? (englishAsk ? " · page " : " · ገጽ ") + data.page : "";
        html += `<p class="cite">${esc(title)}${page}</p>`;
      }
      return html;
    }
    function replyText(data) {
      const emergency = (data.safety || {}).emergency || {};
      if (emergency.is_emergency) {
        return `<p class="emerg">ይህ አስቸኳይ ሊሆን ይችላል። እባክዎ ወደ ቅርብ የጤና ተቋም ይሂዱ።</p>`;
      }
      if (TALK[data.intent]) {
        return `<p class="am">${esc(TALK[data.intent])}</p>`;
      }
      if (data.requires_clarification) {
        return `<p class="clarify">${esc(CLARIFY[data.clarification_question_key] || "እባክዎ ጥያቄውን ያብራሩ።")}</p>`;
      }
      const named = (data.entities || []).some((e) => e.type === "contraceptive_method");
      const allHits = (data.retrieval_results || []).filter((h) => h.amharic_text && !h.polarity_conflict);
      const specific = allHits.filter((h) => h.evidence_id !== "chunk_methods" && h.evidence_id !== "chunk_choose_with_provider");
      const hits = named && specific.length ? specific : allHits;
      const maxn = named ? 3 : 1;
      const picked = [];
      const seen = new Set();
      for (const h of hits) {
        if (picked.length >= maxn) break;
        if (h.fused_score != null && picked.length && h.fused_score < 0.16) break;
        const key = h.amharic_text.slice(0, 40);
        if (seen.has(key)) continue;
        seen.add(key);
        picked.push(h);
      }
      if (picked.length) {
        return picked.map((h) => `<p class="am">${esc(h.amharic_text)}</p>`).join("");
      }
      return `<p class="empty">ይቅርታ፣ ለዚህ ጥያቄ በቂ መረጃ የለኝም።</p>`;
    }
    function nextContext(data) {
      const ents = data.entities || [];
      const method = ents.find((e) => e.type === "contraceptive_method");
      // Medical topic (Layer B) is independent of conversational intent (Layer A).
      const topic = data.topic || (data.topics && data.topics[0]) || null;
      return {
        turn_index: (context && context.turn_index || 0) + 1,
        last_intents: [data.intent].concat(data.intent_labels || []).slice(0, 6),
        last_entities: ents.map((e) => ({ type: e.type, value: e.value, surface: e.surface })),
        last_topic: topic || null,
        last_method: (method && method.value) || null,
      };
    }
    function setStatus(msg) {
      if (statusTag) statusTag.textContent = msg;
    }
    async function sleep(ms) {
      return new Promise((r) => setTimeout(r, ms));
    }
    async function ready() {
      go.disabled = true;
      setStatus("ሞዴሉ እየተጫነ ነው… / Loading model…");
      // Poll until MiniLM + KB finish; early /nlp/reply and /documents/ingest return 503.
      for (let i = 0; i < 120; i++) {
        try {
          const h = await (await fetch("/health")).json();
          if (h.status === "ok") {
            if ((h.chunks || 0) === 0) {
              await fetch("/documents/ingest", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                  path: "data/kb/fp_user_kb.json",
                  document_version: "demo",
                  review_status: "unreviewed",
                }),
              });
            }
            engineReady = true;
            go.disabled = false;
            setStatus(
              `ዝግጁ · ${h.embedder || "embedder"} · ${h.chunks || 0} chunks · Reproductive health information`
            );
            return;
          }
          if (h.status === "error") {
            setStatus(`ስህተት / Error: ${h.error || "load failed"}`);
            return;
          }
          setStatus("ሞዴሉ እየተጫነ ነው… / Loading model and knowledge base…");
        } catch {
          setStatus("ሰርቨሩ አልተገኘም… / Waiting for server…");
        }
        await sleep(2000);
      }
      setStatus("ጭነት አልተጠናቀቀም — ገጹን ያድሱ / Still loading — refresh the page");
    }
    async function send() {
      const text = q.value.trim();
      if (!text) return;
      if (!engineReady) {
        setStatus("እባክዎ ሞዴሉ እስኪጠናቀቅ ይጠብቁ… / Please wait until the model is ready…");
        return;
      }
      q.value = "";
      add(`<div class="user">${esc(text)}</div>`);
      if (welcome && welcome.remove) welcome.remove();
      go.disabled = true;
      const englishAsk = askedInEnglish(text);
      const wait = add(`<article class="card"><p class="wait">${englishAsk ? "Please wait…" : "እባክዎ ይጠብቁ…"}</p></article>`);
      try {
        const res = await fetch("/nlp/reply", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text, conversation_id: conversationId, context }),
        });
        if (res.status === 503) {
          engineReady = false;
          wait.innerHTML = `<p class="empty">${englishAsk ? "Server is still loading. Wait a moment and try again." : "ሰርቨሩ እየተጫነ ነው። ትንሽ ጠብቀው እንደገና ይሞክሩ።"}</p>`;
          ready();
          return;
        }
        const data = await res.json();
        wait.innerHTML = renderTurn(data, text);
        context = nextContext(data);
      } catch {
        wait.innerHTML = `<p class="empty">${englishAsk ? "Could not get an answer. Please try again." : "አሁን መልስ ማግኘት አልተቻለም። እባክዎ እንደገና ይሞክሩ።"}</p>`;
      } finally {
        if (engineReady) go.disabled = false;
        q.focus();
        log.scrollTop = log.scrollHeight;
      }
    }

    go.onclick = send;
    q.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        send();
      }
    });
    ready();
  </script>
</body>
</html>
