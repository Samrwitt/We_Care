<!DOCTYPE html>
<html lang="am">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ዌ ኬር</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Ethiopic:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --paper: #f3eadc;
      --ink: #1a2420;
      --mute: #5c6a64;
      --pine: #11463c;
      --clay: #b85c38;
      --card: #fffaf2;
      --line: rgba(26, 36, 32, 0.12);
      --shadow: 0 10px 28px rgba(17, 40, 34, 0.08);
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; height: 100dvh; margin: 0; overflow: hidden; }
    body {
      font-family: "Noto Sans Ethiopic", sans-serif;
      color: var(--ink);
      background:
        repeating-linear-gradient(transparent, transparent 27px, rgba(184, 92, 56, 0.05) 28px),
        radial-gradient(1200px 500px at 10% -10%, #f7f1e6, var(--paper));
    }
    .shell {
      max-width: 720px;
      margin: 0 auto;
      height: 100%;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
    }
    header {
      padding: 16px 20px 12px;
      border-bottom: 1px solid var(--line);
      background: var(--paper);
    }
    .wordmark {
      font-size: 26px;
      font-weight: 700;
      color: var(--pine);
      line-height: 1;
    }
    .tag { margin-top: 4px; font-size: 13px; color: var(--mute); }
    #log {
      padding: 18px 20px 20px;
      overflow-y: auto;
      min-height: 0;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .welcome, .card {
      background: var(--card);
      border: 1px solid var(--line);
      box-shadow: var(--shadow);
      padding: 16px 18px;
      border-radius: 4px 18px 18px 18px;
    }
    .welcome h2 {
      margin: 0 0 8px;
      font-size: 20px;
      font-weight: 600;
      color: var(--pine);
    }
    .welcome p { margin: 0 0 14px; color: var(--mute); font-size: 15px; line-height: 1.55; }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; }
    .chip, .send {
      font-family: inherit;
      cursor: pointer;
      border: 1px solid var(--line);
      background: #fff;
      color: var(--pine);
      border-radius: 999px;
      padding: 8px 12px;
      font-size: 13px;
    }
    .chip:hover { background: #efe4d2; }
    .user {
      align-self: flex-end;
      max-width: 92%;
      background: var(--pine);
      color: #f7f3ea;
      padding: 10px 14px;
      border-radius: 16px 16px 4px 16px;
      font-size: 16px;
      line-height: 1.55;
    }
    .card { padding: 14px 16px; }
    .am { margin: 0 0 10px; font-size: 17px; line-height: 1.7; }
    .am:last-child { margin-bottom: 0; }
    .emerg, .clarify, .empty, .wait {
      margin: 0;
      font-size: 16px;
      line-height: 1.6;
    }
    .emerg { color: #6d1d16; }
    .empty, .wait { color: var(--mute); }
    .composer {
      padding: 10px 16px 14px;
      background: var(--paper);
      border-top: 1px solid var(--line);
    }
    .box {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
      align-items: end;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 8px 8px 8px 14px;
      box-shadow: var(--shadow);
    }
    textarea {
      width: 100%;
      border: 0;
      resize: none;
      outline: none;
      font: inherit;
      font-size: 16px;
      line-height: 1.5;
      min-height: 44px;
      max-height: 140px;
      background: transparent;
      color: var(--ink);
    }
    .send {
      background: var(--pine);
      color: #f7f3ea;
      border: 0;
      min-width: 72px;
      height: 40px;
      font-weight: 600;
    }
    .send:disabled { opacity: 0.5; cursor: wait; }
    .fine { margin: 8px 6px 0; font-size: 12px; color: var(--mute); }
  </style>
</head>
<body>
  <div class="shell">
    <header>
      <div class="wordmark">ዌ ኬር</div>
      <div class="tag">የቤተሰብ ምጣኔ መረጃ</div>
    </header>
    <div id="log"></div>
    <div class="composer">
      <div class="box">
        <textarea id="q" rows="1" placeholder="ጥያቄዎን ይጻፉ…"></textarea>
        <button class="send" id="go" type="button">ላክ</button>
      </div>
      <p class="fine">ይህ የመረጃ መልስ ነው። የሐኪም ምክር አይተካም።</p>
    </div>
  </div>
  <script>
    const STARTERS = [
      "የእርግዝና መከላከያ ዘዴዎች ምንድን ናቸው?",
      "ኮንዶም ምንድን ነው?",
      "ክኒን ከተረሳ ምን ላድርግ?",
      "ኢምፕላንት ለምን ያህል ጊዜ ይቆያል?",
      "ጡት እያጠባሁ መርፌ መጠቀም ይቻላል?",
    ];
    const CLARIFY = {
      which_method: "የትኛውን የእርግዝና መከላከያ ዘዴ ማለትዎ ነው?",
    };
    const TALK = {
      greeting: "ሰላም፣ እንኳን ደህና መጡ። ስለ እርግዝና መከላከያ መጠየቅ ይችላሉ።",
      conversation_end: "ደህና ሁኑ። ሌላ ጥያቄ ካለዎት እዚህ ይመለሱ።",
      out_of_domain: "አሁን የምሰጠው መረጃ ስለ የቤተሰብ ምጣኔ ነው። እባክዎ ስለ እርግዝና መከላከያ ይጠይቁ።",
    };
    const log = document.getElementById("log");
    const q = document.getElementById("q");
    const go = document.getElementById("go");
    const conversationId = crypto.randomUUID();
    let context = null;

    function el(html) {
      const d = document.createElement("div");
      d.innerHTML = html;
      return d.firstElementChild;
    }
    function esc(s) {
      return String(s ?? "").replace(/[&<>"']/g, (c) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[c]));
    }
    function add(html) {
      const node = el(html);
      log.appendChild(node);
      log.scrollTop = log.scrollHeight;
      return node;
    }

    const welcome = add(`
      <div class="welcome">
        <h2>እንኳን ደህና መጡ</h2>
        <p>ስለ እርግዝና መከላከያ መጠየቅ ይችላሉ። ከታች ካሉት ጥያቄዎች አንዱን ይንኩ ወይም የራስዎን ይጻፉ።</p>
        <div class="chips" id="starters"></div>
      </div>
    `);
    STARTERS.forEach((t) => {
      const b = document.createElement("button");
      b.className = "chip";
      b.type = "button";
      b.textContent = t;
      b.onclick = () => { q.value = t; send(); };
      document.getElementById("starters").appendChild(b);
    });

    function replyText(data) {
      const emergency = (data.safety || {}).emergency || {};
      if (emergency.is_emergency) {
        return `<p class="emerg">ይህ አስቸኳይ ሊሆን ይችላል። እባክዎ ወደ ቅርብ የጤና ተቋም ይሂዱ።</p>`;
      }
      if (TALK[data.intent]) {
        return `<p class="am">${esc(TALK[data.intent])}</p>`;
      }
      if (data.requires_clarification) {
        return `<p class="clarify">${esc(CLARIFY[data.clarification_question_key] || "እባክዎ ጥያቄውን ያብራሩ።")}</p>`;
      }
      const named = (data.entities || []).some((e) => e.type === "contraceptive_method");
      const hits = (data.retrieval_results || []).filter((h) => h.amharic_text && !h.polarity_conflict);
      const maxn = named ? 3 : 1;
      const picked = [];
      const seen = new Set();
      for (const h of hits) {
        if (picked.length >= maxn) break;
        if (h.fused_score != null && picked.length && h.fused_score < 0.16) break;
        const key = h.amharic_text.slice(0, 40);
        if (seen.has(key)) continue;
        seen.add(key);
        picked.push(h);
      }
      if (picked.length) {
        return picked.map((h) => `<p class="am">${esc(h.amharic_text)}</p>`).join("");
      }
      return `<p class="empty">ይቅርታ፣ ለዚህ ጥያቄ በቂ መረጃ የለኝም።</p>`;
    }
    function nextContext(data) {
      const ents = data.entities || [];
      const method = ents.find((e) => e.type === "contraceptive_method");
      return {
        turn_index: (context && context.turn_index || 0) + 1,
        last_intents: [data.intent].concat(data.intent_labels || []).slice(0, 6),
        last_entities: ents.map((e) => ({ type: e.type, value: e.value, surface: e.surface })),
        last_topic: data.intent,
        last_method: (method && method.value) || (context && context.last_method) || null,
      };
    }
    async function ready() {
      try {
        const h = await (await fetch("/health")).json();
        if ((h.chunks || 0) < 20) {
          await fetch("/documents/ingest", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              path: "data/kb/fp_user_kb.json",
              document_version: "demo",
              review_status: "unreviewed",
            }),
          });
        }
      } catch {
        /* shown only if a question later fails */
      }
    }
    async function send() {
      const text = q.value.trim();
      if (!text) return;
      q.value = "";
      add(`<div class="user">${esc(text)}</div>`);
      if (welcome && welcome.remove) welcome.remove();
      go.disabled = true;
      const wait = add(`<article class="card"><p class="wait">እባክዎ ይጠብቁ…</p></article>`);
      try {
        const res = await fetch("/nlp/analyze", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text, conversation_id: conversationId, context }),
        });
        const data = await res.json();
        wait.innerHTML = replyText(data);
        context = nextContext(data);
      } catch {
        wait.innerHTML = `<p class="empty">አሁን መልስ ማግኘት አልተቻለም። እባክዎ እንደገና ይሞክሩ።</p>`;
      } finally {
        go.disabled = false;
        q.focus();
        log.scrollTop = log.scrollHeight;
      }
    }

    go.onclick = send;
    q.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        send();
      }
    });
    ready();
  </script>
</body>
</html>
