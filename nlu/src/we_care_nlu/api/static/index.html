<!DOCTYPE html>
<html lang="am">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ዌ ኬር</title>
  <!--
    Chat UI for We Care NLU.
    Markup only here — styles in styles.css, behaviour in app.js.
    See README.md in this folder.
  -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Ethiopic:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <div class="shell">
    <header>
      <div class="wordmark">ዌ ኬር</div>
      <div class="tag" id="statusTag">የሥርዓተ-ተዋልዶ ጤና መረጃ · Reproductive health information</div>
    </header>

    <!-- Messages appear here (welcome card, user bubbles, bot answers). -->
    <div id="log"></div>

    <div class="composer">
      <div class="box">
        <textarea id="q" rows="1" placeholder="ጥያቄዎን ይጻፉ… / Ask in English"></textarea>
        <button class="send" id="go" type="button">ላክ</button>
      </div>
    </div>
  </div>

  <script src="/static/app.js" defer></script>
</body>
</html>
